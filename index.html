
<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="jFVxDLZgfVHx67qhRmi5YEtkL5CEWRqWqtvAd5lD0F8" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0000">
  <title>Text To Key</title>

  <style>
    :root {
      --bg: #0a0000;
      --red: #ff1a1a;
      --dark-red: #b30000;
      --text: #ffcccc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", monospace;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        rgba(255, 0, 0, 0.035) 1px,
        transparent 3px
      );
    }

    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      background: rgba(179, 0, 0, 0.08);
      filter: blur(120px);
      border-radius: 50%;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      width: min(100%, 560px);
      padding: 34px 28px;
      background: rgba(15, 0, 0, 0.96);
      border: 1px solid var(--dark-red);
      border-radius: 12px;
      box-shadow:
        0 0 15px rgba(255, 0, 0, 0.25),
        0 0 45px rgba(179, 0, 0, 0.12),
        inset 0 0 20px rgba(179, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      color: var(--red);
      font-size: clamp(30px, 7vw, 46px);
      margin-bottom: 26px;
      letter-spacing: 4px;
      text-shadow:
        0 0 5px var(--red),
        0 0 15px var(--red),
        0 0 30px var(--dark-red);
      animation: flicker 3s infinite;
    }

    @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% {
        opacity: 1;
      }
      20%, 24%, 55% {
        opacity: 0.75;
      }
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 0.9em;
      background: var(--red);
      vertical-align: middle;
      margin-left: 5px;
      animation: blink 0.8s steps(2) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 135px;
      resize: vertical;
      padding: 16px;
      background: #100000;
      color: var(--red);
      border: 1px solid var(--dark-red);
      border-radius: 7px;
      outline: none;
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      transition: 0.25s;
    }

    textarea::placeholder {
      color: #853333;
    }

    textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 12px rgba(255, 26, 26, 0.45);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      font-weight: bold;
      transition: 0.25s ease;
    }

    .generate-btn {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: #240000;
      color: var(--red);
      border: 1px solid var(--red);
      border-radius: 7px;
      font-size: 15px;
      letter-spacing: 2px;
    }

    .generate-btn:hover:not(:disabled) {
      background: var(--dark-red);
      color: white;
      box-shadow: 0 0 20px rgba(255, 26, 26, 0.55);
    }

    button:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      color: #ff3333;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
      min-height: 0;
    }

    .error:not(:empty) {
      min-height: 18px;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 16px;
      background: #100000;
      border: 1px solid var(--dark-red);
      border-radius: 7px;
      animation: appear 0.3s ease;
    }

    .result.visible {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .key-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #generatedKey {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--red);
      font-size: clamp(16px, 4vw, 22px);
      letter-spacing: 3px;
      text-shadow: 0 0 10px red;
    }

    .copy-btn {
      padding: 10px 14px;
      color: white;
      background: #4a0000;
      border: 1px solid var(--red);
      border-radius: 5px;
    }

    .copy-btn:hover {
      background: var(--red);
      box-shadow: 0 0 12px red;
    }

    @media (max-width: 480px) {
      .container {
        padding: 26px 18px;
      }

      h1 {
        letter-spacing: 2px;
        margin-bottom: 22px;
      }

      .key-row {
        flex-direction: column;
        align-items: stretch;
      }

      #generatedKey {
        text-align: center;
      }

      .copy-btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Text To Key<span class="cursor"></span></h1>

    <textarea
      id="inputText"
      placeholder="Enter text..."
      aria-label="Enter text to generate a key"
    ></textarea>

    <button
      class="generate-btn"
      id="generateBtn"
      type="button"
    >
      GENERATE KEY
    </button>

    <p class="error" id="errorMessage" role="alert"></p>

    <section
      class="result"
      id="resultArea"
      aria-live="polite"
      aria-label="Generated key"
    >
      <div class="key-row">
        <strong id="generatedKey"></strong>

        <button
          class="copy-btn"
          id="copyBtn"
          type="button"
        >
          COPY
        </button>
      </div>
    </section>

  </main>

  <script>
    "use strict";

    const inputText = document.getElementById("inputText");
    const generateBtn = document.getElementById("generateBtn");
    const errorMessage = document.getElementById("errorMessage");
    const resultArea = document.getElementById("resultArea");
    const generatedKey = document.getElementById("generatedKey");
    const copyBtn = document.getElementById("copyBtn");

    const CHARACTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    async function generateHashKey(text) {
      const data = new TextEncoder().encode(text);

      const hashBuffer = await crypto.subtle.digest(
        "SHA-256",
        data
      );

      const hashArray = new Uint8Array(hashBuffer);

      let key = "";

      for (let i = 0; i < 12; i++) {
        key += CHARACTERS[
          hashArray[i] % CHARACTERS.length
        ];
      }

      return key;
    }

    function randomKey() {
      let result = "";

      for (let i = 0; i < 12; i++) {
        result += CHARACTERS[
          Math.floor(Math.random() * CHARACTERS.length)
        ];
      }

      return result;
    }

    generateBtn.addEventListener("click", async () => {
      const text = inputText.value;

      errorMessage.textContent = "";

      if (!text.trim()) {
        errorMessage.textContent = "Enter some text first.";
        resultArea.classList.remove("visible");
        inputText.focus();
        return;
      }

      if (!window.crypto || !crypto.subtle) {
        errorMessage.textContent =
          "Key generation is unavailable in this browser.";
        return;
      }

      generateBtn.disabled = true;
      copyBtn.textContent = "COPY";
      resultArea.classList.add("visible");

      try {
        const finalKey = await generateHashKey(text);

        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        if (reducedMotion) {
          generatedKey.textContent = finalKey;
        } else {
          const startTime = performance.now();

          while (performance.now() - startTime < 500) {
            generatedKey.textContent = randomKey();

            await new Promise(resolve =>
              setTimeout(resolve, 50)
            );
          }

          generatedKey.textContent = finalKey;
        }

      } catch (error) {
        resultArea.classList.remove("visible");

        errorMessage.textContent =
          "Could not generate a key. Please try again.";

        console.error(error);

      } finally {
        generateBtn.disabled = false;
      }
    });

    copyBtn.addEventListener("click", async () => {
      const key = generatedKey.textContent;

      if (!key) return;

      try {
        await navigator.clipboard.writeText(key);

        copyBtn.textContent = "COPIED";

        setTimeout(() => {
          copyBtn.textContent = "COPY";
        }, 1500);

      } catch (error) {
        copyBtn.textContent = "COPY FAILED";

        errorMessage.textContent =
          "Select the key and copy it manually.";

        setTimeout(() => {
          copyBtn.textContent = "COPY";
        }, 1500);
      }
    });
  </script>

</body>
</html>
